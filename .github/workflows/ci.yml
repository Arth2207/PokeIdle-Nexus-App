name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"
  IMAGEM: ghcr.io/arth2207/nexus-api
  LIMITE_IMAGEM_MB: 50

permissions:
  contents: read

jobs:
  verificar:
    name: fmt, clippy e testes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  dependencias:
    name: licenças e vulnerabilidades
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          # O container da action traz um Rust antigo; o rust-toolchain.toml exige 1.99.1.
          rust-version: "1.99.1"

  imagem:
    name: imagem Docker
    needs: [verificar, dependencias]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGEM }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Tamanho da imagem
        run: |
          bytes=$(docker image inspect -f '{{.Size}}' "$IMAGEM:$GITHUB_SHA")
          mb=$(( bytes / 1024 / 1024 ))
          echo "imagem: ${mb} MB (limite ${LIMITE_IMAGEM_MB} MB)" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "$mb" -lt "$LIMITE_IMAGEM_MB" ]
      - name: Smoke test
        run: |
          # O binário roda na imagem final e responde ao argumento inválido com a ajuda.
          saida=$(docker run --rm -e NEXUS_DATABASE_URL=postgres://x@localhost/x \
            "$IMAGEM:$GITHUB_SHA" comando-invalido 2>&1 || true)
          echo "$saida"
          grep -q "uso: nexus-api" <<< "$saida"
      - name: Push
        run: |
          docker tag "$IMAGEM:$GITHUB_SHA" "$IMAGEM:latest"
          docker push "$IMAGEM:$GITHUB_SHA"
          docker push "$IMAGEM:latest"

  deploy:
    name: deploy na VPS
    needs: imagem
    runs-on: ubuntu-24.04
    environment: producao
    permissions:
      packages: read
    steps:
      - name: Chave SSH
        run: |
          install -d -m 700 ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy
          echo "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy
      - name: Deploy blue/green
        # O token do GHCR vai pela entrada padrão; o deploy.sh faz login, puxa e faz logout.
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            ssh -i ~/.ssh/deploy -o BatchMode=yes \
              "nexus-deploy@${{ secrets.VPS_HOST }}" "deploy $GITHUB_SHA"
