[package]
name = "nexus-api"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
arc-swap = "1.9.5"
axum = { version = "0.8.9", features = ["ws"] }
config = { version = "0.15.27", default-features = false }
contrato = { version = "0.1.0", path = "../contrato" }
dotenvy = "0.15.7"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
getrandom = "0.4.3"
hex = "0.4.3"
metrics = "0.24.6"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }
moka = { version = "0.12.16", features = ["future", "sync"] }
nucleo = { version = "0.1.0", path = "../nucleo", features = ["paralelo"] }
persistencia = { version = "0.1.0", path = "../persistencia" }
rayon = "1.12.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
tokio-util = "0.7.20"
tower-http = { version = "0.7.1", features = ["compression-br", "compression-gzip", "cors", "request-id", "trace", "util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

[lints]
workspace = true

[dev-dependencies]
testcontainers = "0.28.0"
tokio-tungstenite = "0.29.0"
tower = { version = "0.5.3", features = ["util"] }
