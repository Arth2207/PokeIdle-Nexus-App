[package]
name = "a2-nucleo"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
contrato = { path = "../contrato" }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt", "time", "sync"] }
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt", "time", "sync", "test-util"] }

[lints]
workspace = true
