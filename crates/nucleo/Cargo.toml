[package]
name = "nucleo"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Paraleliza partes do cálculo com rayon. Desligado no WebAssembly (o app desktop roda o
# motor no navegador embutido, sem threads).
paralelo = ["dep:rayon"]

[dependencies]
rayon = { version = "1.12.0", optional = true }
libm = "0.2.16"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
unicode-normalization = "0.1.26"

[lints]
workspace = true

[dev-dependencies]
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
proptest = "1.12.0"
tokio = { version = "1.54.1", features = ["macros", "rt"] }
criterion = { version = "0.7", default-features = false }

[[bench]]
name = "combate"
harness = false
