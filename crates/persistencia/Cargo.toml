[package]
name = "persistencia"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
nucleo = { version = "0.1.0", path = "../nucleo" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "macros", "json"] }

[lints]
workspace = true

[dev-dependencies]
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "macros", "json", "migrate"] }
testcontainers = "0.28.0"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
