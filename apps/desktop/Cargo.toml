# Casca Tauri 2 do app A2. Workspace PRÓPRIO, fora do principal (a VPS não tem webkit/gtk e
# o ADR 0008 proíbe build local). Cargo.lock é gerado no CI (windows-latest), ver docs/a2-desktop.md.
[workspace]

[package]
name = "nexus-desktop"
version = "0.1.7"
edition = "2021"
license = "MIT"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
a2-nucleo = { path = "../../crates/a2-nucleo" }
# Só para escolher o provedor de criptografia do TLS (wss://): sem ele o rustls não conecta.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# HTTP do relay (ofertas da Bolsa etc.); TLS pelo rustls acima.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
tauri = { version = "2", features = ["unstable"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
