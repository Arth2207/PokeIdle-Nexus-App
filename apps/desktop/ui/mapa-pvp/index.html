<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapa PvP · Holodex Nexus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@400;500;600;700;800&display=swap">
<script>
  const temaSalvo = () => { try { return localStorage.getItem('hdx-tema'); } catch { return null; } };
  function aplicarTema() {
    const tema = temaSalvo();
    document.documentElement.dataset.theme = tema === 'dark' || (!tema && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }
  aplicarTema();
  addEventListener('storage', e => { if (e.key === 'hdx-tema') aplicarTema(); });
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', aplicarTema);
  if (new URLSearchParams(location.search).get('origem') === 'dossie') {
    const tema = document.createElement('link');
    tema.rel = 'stylesheet';
    tema.href = '/tema.css';
    document.head.append(tema);
  }
</script>
<link rel="stylesheet" href="mapa.css?v=wallpaper">
<script src="mapa.js?v=dossie" defer></script>
</head>
<body>
<div class="wallpaper" aria-hidden="true"></div>
<div class="pagina">
  <nav class="vidro barra" aria-label="Navegação">
    <span class="marca" id="marca">DOS<span>SIÊ</span></span>
    <a class="botao" id="voltar" href="../index.html">Voltar ao painel</a>
  </nav>
  <header class="cabecalho">
    <h1>Mapa PvP</h1>
  </header>
<main>
  <div class="controles vidro">
    <input type="search" id="busca" aria-label="Buscar Pokémon ou jogador" placeholder="Buscar Pokémon ou jogador…">
    <label><input type="checkbox" id="usadas"> Só usadas</label>
    <label><input type="checkbox" id="linhas" checked> Todas as ligações</label>
    <div class="zoom" aria-label="Zoom do mapa">
      <button id="menos" aria-label="Diminuir zoom">−</button><button id="mais" aria-label="Aumentar zoom">+</button><button id="ajustar">Enquadrar</button>
    </div>
  </div>
  <div id="tipos" aria-label="Filtrar por tipo"></div>
  <div class="conteudo">
    <section class="grafico vidro" aria-label="Mapa radial">
      <canvas id="mapa" aria-label="Mapa de espécies e equipes. Use a busca e as listas para selecionar pelo teclado."></canvas>
      <p class="ajuda">Arraste para mover · Clique para destacar · Esc limpa a seleção</p>
    </section>
    <aside class="vidro" aria-label="Dados do mapa">
      <div class="fonte">
        <p id="status" role="status">Carregando Pokédex e dados do PvP…</p>
        <label for="ranking">Carregar ranking</label>
        <input id="ranking" type="file" accept=".json,application/json" aria-describedby="arquivo-ajuda">
        <small id="arquivo-ajuda">Use o arquivo relay-treino.json salvo pelo Nexus Desktop.</small>
        <button id="meta" hidden>Voltar ao meta observado</button>
        <p id="erro" role="alert" hidden></p>
      </div>
      <div id="selecao" aria-live="polite" hidden></div>
      <h2 id="titulo-usos">Mais usados</h2>
      <div id="especies" class="lista"></div>
      <h2 id="titulo-grupos">Equipes</h2>
      <div id="grupos" class="lista"></div>
    </aside>
  </div>
</main>
</div>
</body>
</html>
