# Painel do Nexus (telas Leptos) como site. Só pela rede do Tailscale (esta borda). A API vai
# só para leitura (GET), com o token da borda posto aqui: o navegador nunca o vê.
location = /painel { return 301 /painel/; }
# Única escrita pelo site: ligar/desligar e ajustar regras do motor (só esta rota, só POST).
location = /painel/api/motor/config {
    limit_except POST { deny all; }
    client_max_body_size 4k;
    include /etc/nginx/borda/token.conf;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_pass http://nexus/api/motor/config;
}
location ^~ /painel/api/ {
    limit_except GET { deny all; }
    include /etc/nginx/borda/token.conf;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_pass http://nexus/api/;
}
location ^~ /painel/ {
    alias /etc/nginx/borda/painel/;
    index index.html;
    # A borda não inclui mime.types: o navegador recusa JS e WebAssembly como text/plain.
    types {
        text/html html;
        application/javascript js;
        application/wasm wasm;
        text/css css;
        image/webp webp;
        image/png png;
    }
}
