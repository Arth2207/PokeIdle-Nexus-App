# nexus-borda: cutover das fases 1 (bolsa) e 2 (equipes) sem mexer no relay do PC.
#
# O relay e o painel continuam chamando a porta 8181 do legado pela Tailscale. Uma regra
# REDIRECT (cutover-fase1-2.sh) manda esse tráfego para cá; bolsa e equipes seguem para o
# Nexus, com o token da borda, e o resto (/ingest, comandos, raros, shiny, motor) para o
# mapper em loopback, sem mudança. Roda na rede do host (network_mode: host).

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 512;
}

http {
    server_tokens off;

    log_format json escape=json
        '{"ts":"$time_iso8601","ip":"$remote_addr","metodo":"$request_method",'
        '"uri":"$uri","status":$status,"bytes":$body_bytes_sent,"latencia":$request_time,'
        '"upstream":"$upstream_addr"}';
    access_log /dev/stdout json;

    # O legado não limita o corpo; um lote completo de ofertas passa de 2 MB.
    client_max_body_size 20m;
    client_body_buffer_size 1m;
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_set_header Connection "";

    upstream legado {
        server 127.0.0.1:8181;
        keepalive 8;
        # O Node fecha conexão ociosa em 5 s; fechar antes evita 502 por reuso.
        keepalive_timeout 4s;
    }
    upstream nexus {
        server 127.0.0.1:8480;
        keepalive 8;
    }

    server {
        # Só o IP do Tailscale: o REDIRECT troca o destino para o endereço da interface.
        listen 100.115.131.15:8183;

        # Saúde da borda (a guarda só aplica o REDIRECT com 200 aqui).
        location = /borda-saude {
            access_log off;
            return 200 "ok\n";
        }

        location /api/bolsa/ {
            # O token do cliente (do legado) é trocado pelo da borda (leitura + escrita).
            include /etc/nginx/borda/cors.conf;
            include /etc/nginx/borda/token.conf;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_pass http://nexus;
        }
        location /api/equipes/ {
            include /etc/nginx/borda/cors.conf;
            include /etc/nginx/borda/token.conf;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_pass http://nexus;
        }
        location / {
            # Repasse transparente: cabeçalhos e query (inclusive ?token) do cliente.
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_pass http://legado;
        }
    }
}
