# Borda do Nexus. Único serviço exposto fora da rede Docker.

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 512;
}

http {
    server_tokens off;

    # $uri não inclui a query string, então um ?token= nunca chega ao log.
    log_format json escape=json
        '{"ts":"$time_iso8601","request_id":"$request_id","ip":"$remote_addr",'
        '"metodo":"$request_method","uri":"$uri","status":$status,'
        '"bytes":$body_bytes_sent,"latencia":$request_time,'
        '"upstream":"$upstream_addr","upstream_latencia":"$upstream_response_time",'
        '"agente":"$http_user_agent"}';
    access_log /dev/stdout json;

    # Sistema de arquivos somente leitura: tudo que é temporário vai para /tmp.
    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;

    client_max_body_size  2m;
    client_body_timeout   15s;
    client_header_timeout 15s;
    send_timeout          30s;
    keepalive_timeout     30s;

    gzip on;
    gzip_min_length 1024;
    gzip_types application/json text/plain text/css application/javascript;

    # Proteção grossa por IP. O limite fino (por token) fica na aplicação.
    limit_req_zone $binary_remote_addr zone=por_ip:10m rate=20r/s;
    limit_req_status 429;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Define o upstream "nexus_api" apontando para a cor ativa. Reescrito pelo deploy.sh.
    include /etc/nginx/upstream/ativo.conf;

    # HSTS só faz sentido em HTTPS. Em HTTP (localhost) o header sai vazio e o Nginx omite.
    map $scheme $hsts {
        https   "max-age=31536000";
        default "";
    }

    server {
        # 80: só localhost e healthcheck. 443: acesso via Tailscale, com certificado do
        # `tailscale cert` (renovado por deploy/renovar-tls.sh).
        listen 80 default_server;
        listen 443 ssl default_server;
        http2 on;

        ssl_certificate     /etc/nginx/tls/cert.pem;
        ssl_certificate_key /etc/nginx/tls/key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:TLS:1m;
        ssl_session_timeout 1h;

        add_header Strict-Transport-Security $hsts always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Request-Id      $request_id;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;

        # Saúde do próprio Nginx (healthcheck do container).
        location = /nginx-saude {
            access_log off;
            return 200 "ok\n";
        }

        location / {
            limit_req zone=por_ip burst=40 nodelay;
            proxy_set_header Connection "";
            proxy_read_timeout 60s;
            proxy_pass http://nexus_api;
        }

        # Bolsa e equipes (fases 1 e 2). Depois do cutover chegam pela nexus-borda, que
        # concentra o relay e o painel num só IP: sem rate limit por IP aqui, e corpo maior
        # porque um lote completo de ofertas passa de 2 MB (a API aceita até 10 MB).
        location /api/bolsa/ {
            client_max_body_size 10m;
            proxy_set_header Connection "";
            proxy_read_timeout 120s;
            proxy_pass http://nexus_api;
        }
        location /api/equipes/ {
            client_max_body_size 10m;
            proxy_set_header Connection "";
            proxy_read_timeout 120s;
            proxy_pass http://nexus_api;
        }

        # WebSocket (fase 3). Timeout maior que o ping de 20s do servidor.
        location = /ws {
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 75s;
            proxy_send_timeout 75s;
            proxy_pass http://nexus_api;
        }
    }
}
