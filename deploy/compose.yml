# Produção do Nexus. Instalado em /opt/nexus-deploy por deploy/instalar.sh.
#
# Duas cópias da API (blue e green) para deploy sem downtime: o deploy.sh sobe a cor
# inativa com a imagem nova, espera ela ficar saudável e troca o upstream do Nginx.
# As imagens de cada cor ficam em ./imagens.env, que o deploy.sh atualiza e exporta.

name: nexus

x-api: &api
  environment:
    NEXUS_ENDERECO: 0.0.0.0
    NEXUS_LOG_FORMATO: json
    NEXUS_DATABASE_URL_FILE: /run/secrets/database_url
    # Espelho só-leitura de public.comando_fila em nexus.comando (shadow da fila, fase 3).
    NEXUS_ESPELHO_COMANDOS: "true"
    # Cutover das fases 1 e 2 (cutover-fase1-2.sh on|off troca estes valores).
    NEXUS_ESCRITA_BOLSA: "false"
    NEXUS_ESCRITA_EQUIPES: "false"
    # Vendas do mercado que o app coleta: a API repassa ao Dossiê com a chave do servidor.
    NEXUS_DOSSIE_URL: http://nexus-dossie:9192
    NEXUS_DOSSIE_CHAVE_FILE: /run/secrets/dossie_chave_api
  secrets:
    - database_url
    - dossie_chave_api
  volumes:
    # Postgres do host pelo socket Unix: nenhuma porta de banco exposta em rede.
    - /var/run/postgresql:/var/run/postgresql
  networks:
    default: {}
    monitoring:
      aliases: [nexus-api]
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  healthcheck:
    test: ["CMD", "/nexus-api", "healthcheck"]
    interval: 10s
    timeout: 5s
    retries: 3
    start_period: 5s
  stop_grace_period: 30s
  restart: unless-stopped
  deploy:
    resources:
      limits:
        cpus: "1.5"
        # Pico no boot ~770 MB (blue registrou 762 MB); estável ~300 MB.
        memory: 1G
  logging: &logs
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  nexus-api-blue:
    <<: *api
    image: ${NEXUS_IMAGEM_BLUE:-ghcr.io/arth2207/nexus-api:inexistente}

  nexus-api-green:
    <<: *api
    image: ${NEXUS_IMAGEM_GREEN:-ghcr.io/arth2207/nexus-api:inexistente}

  # Comparador de paridade com o sistema legado (shadow das fases). Só faz GETs na porta do
  # legado e grava o resultado em nexus.paridade; a API publica em /metrics.
  # Usa a rede do host porque o firewall não deixa a rede do Docker chegar nessa porta.
  # Não abre nenhuma porta.
  nexus-paridade:
    image: ${NEXUS_IMAGEM_PARIDADE:-ghcr.io/arth2207/nexus-api:inexistente}
    command: ["paridade-continua"]
    network_mode: host
    environment:
      NEXUS_LOG_FORMATO: json
      NEXUS_DATABASE_URL_FILE: /run/secrets/database_url
      NEXUS_PARIDADE_URL: http://127.0.0.1:8181
      NEXUS_PARIDADE_CICLO_S: "600"
      # Fase 4: comparador das rotas do motor. O motor da VPS roda em UTC (o do PC, -180).
      NEXUS_PARIDADE_MOTOR_URL: http://127.0.0.1:47821
      NEXUS_MOTOR_FUSO_MIN: "0"
      # Fase 4: laço do motor em sombra lendo a janela que o app manda (sem o PC antigo).
      NEXUS_MOTOR_SOMBRA_URL: nexus
      NEXUS_MOTOR_SOMBRA_FUSO_MIN: "-180"
      # Compara também /api/bolsa/equipe e /equipe-propria (dispara o cálculo do legado).
      NEXUS_PARIDADE_EQUIPE: "true"
    secrets:
      - database_url
    volumes:
      - /var/run/postgresql:/var/run/postgresql
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 640M
    logging: *logs

  # Cliente sombra: recebe os comandos espelhados pelo WebSocket e confirma como
  # 'sombra' sem executar nada. Mede o critério de 7 dias (nexus-api sombra-relatorio).
  nexus-sombra:
    image: ${NEXUS_IMAGEM_PARIDADE:-ghcr.io/arth2207/nexus-api:inexistente}
    command: ["sombra"]
    network_mode: host
    environment:
      NEXUS_LOG_FORMATO: json
      NEXUS_SOMBRA_URL: ws://127.0.0.1:8480/ws
      NEXUS_SOMBRA_TOKEN_FILE: /run/secrets/sombra_token
      # Um comando sintético a cada ~5 min (só schema nexus) para medir a fila.
      NEXUS_SOMBRA_GERAR_S: "300"
      # A configuração comum exige o banco, mesmo o cliente sombra não usando.
      NEXUS_DATABASE_URL_FILE: /run/secrets/database_url
    secrets:
      - sombra_token
      - database_url
    volumes:
      - /var/run/postgresql:/var/run/postgresql
    read_only: true
    tmpfs: [/tmp]
    restart: unless-stopped
    logging: *logs

  # Worker de ETL e jobs agendados. Sem porta pública; só /health/ready e /metrics internos.
  # Cursor transacional no Postgres + ON CONFLICT garante idempotência — restart durante
  # deploy não duplica nem perde dados.
  nexus-worker:
    image: ${NEXUS_IMAGEM_WORKER:-ghcr.io/arth2207/nexus-api:inexistente}
    entrypoint: ["/nexus-worker"]
    environment:
      NEXUS_LOG_FORMATO: json
      NEXUS_DATABASE_URL_FILE: /run/secrets/database_url
      NEXUS_PORTA_METRICAS: "9191"
      # Cutover da Fase 5: true = grava no public (ver cutover-fase5.sh etl-on/etl-off).
      NEXUS_ESCRITA_ETL: "true"
      # Dossiê em sombra (fase 5, etapa 6). Leituras no public, escritas em nexus.*_shadow,
      # uploads no tmpfs /dados. Sem chave configurada: rotas protegidas respondem 401.
      NEXUS_DOSSIE_PORTA: "9192"
      NEXUS_DOSSIE_STATIC: /opt/mapper/data/static
      NEXUS_DOSSIE_DADOS: /dados
      # Chave só do Nexus (a do legado não é copiada); libera as rotas privadas aqui.
      NEXUS_DOSSIE_CHAVE_FILE: /run/secrets/dossie_chave
      # Menos arenas do malloc: as threads do spawn_blocking (montagem do precos.json) não
      # prendem memória cada uma na sua arena.
      MALLOC_ARENA_MAX: "2"
    secrets:
      - database_url
      - dossie_chave
    # Só no loopback do host, para o comparador (nexus-dossie-paridade).
    ports:
      - "127.0.0.1:18899:9192"
    volumes:
      - /var/run/postgresql:/var/run/postgresql
      # Diretório inteiro (não arquivo a arquivo): o relay regrava o equipes-estado.json
      # trocando o arquivo, e um bind de arquivo ficaria preso no inode antigo.
      - /opt/mapper/data:/opt/mapper/data:ro
      # precos.json base, pokedex.json e evolucoes.json do dossiê (etapas 6b/6c).
      - /opt/mapper/engine/data:/opt/mapper/engine/data:ro
    # /opt/mapper/data e engine/data são do grupo dossie (gid 986) — adiciona o gid para leitura
    group_add: ["986"]
    networks:
      default: {}
      monitoring:
        aliases: [nexus-worker]
    read_only: true
    tmpfs:
      - /tmp
      - /dados:uid=65532,gid=65532,mode=0700,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "/nexus-worker", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    stop_grace_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    logging: *logs

  # Comparador de rotas do dossiê: mesma requisição no legado (8899) e no worker (18899).
  # Só GETs e POST/DELETE sem chave (param no 401). Rede do host para chegar no legado.
  nexus-dossie-paridade:
    image: ${NEXUS_IMAGEM_WORKER:-ghcr.io/arth2207/nexus-api:inexistente}
    entrypoint: ["/nexus-worker", "dossie-paridade"]
    network_mode: host
    environment:
      NEXUS_LOG_FORMATO: json
      NEXUS_DATABASE_URL_FILE: /run/secrets/database_url
      NEXUS_DOSSIE_LEGADO_URL: http://127.0.0.1:8899
      NEXUS_DOSSIE_NEXUS_URL: http://127.0.0.1:18899
      NEXUS_DOSSIE_PARIDADE_CICLO_S: "1800"
      # Rotas privadas (precos.json): o legado libera quem entra pela interface do Tailscale.
      NEXUS_DOSSIE_LEGADO_PRIVADO_URL: http://100.115.131.15:8899
      NEXUS_DOSSIE_CHAVE_FILE: /run/secrets/dossie_chave
    secrets:
      - database_url
      - dossie_chave
    volumes:
      - /var/run/postgresql:/var/run/postgresql
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    depends_on: [nexus-worker]
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 512M
    logging: *logs

  # Dossiê em produção (cutover da Fase 5): só sobe com `cutover-fase5.sh dossie-on`.
  # Usuário dossie (994) para gravar as fotos na pasta do legado; portas do dossie.service.
  nexus-dossie:
    profiles: ["cutover"]
    image: ${NEXUS_IMAGEM_WORKER:-ghcr.io/arth2207/nexus-api:inexistente}
    entrypoint: ["/nexus-worker", "dossie-servir"]
    user: "994:986"
    environment:
      NEXUS_LOG_FORMATO: json
      NEXUS_DATABASE_URL_FILE: /run/secrets/database_url_dossie
      NEXUS_DOSSIE_PORTA: "9192"
      # Conexões por esta porta contam como privadas (era a interface do Tailscale).
      NEXUS_DOSSIE_PORTA_PRIVADA: "9193"
      NEXUS_DOSSIE_STATIC: /opt/mapper/data/static
      NEXUS_DOSSIE_DADOS: /dados
      NEXUS_DOSSIE_CHAVE_FILE: /run/secrets/dossie_chave_legado
      NEXUS_ESCRITA_DOSSIE: "true"
      MALLOC_ARENA_MAX: "2"
    secrets:
      - database_url_dossie
      - dossie_chave_legado
    ports:
      - "127.0.0.1:8899:9192"
      - "100.115.131.15:8899:9193"
    volumes:
      - /var/run/postgresql:/var/run/postgresql
      - /opt/mapper/data:/opt/mapper/data:ro
      # Única pasta gravável: fotos e uploads do dossiê.
      - /opt/mapper/data/static/fotos:/opt/mapper/data/static/fotos
      - /opt/mapper/engine/data:/opt/mapper/engine/data:ro
    read_only: true
    tmpfs:
      - /tmp
      - /dados:uid=994,gid=986,mode=0700,size=16m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          # Upload de até 200 MB fica inteiro na memória (+ ~260 MB do precos.json).
          memory: 1G
    logging: *logs

  nginx:
    image: nginx:1.28.0-alpine
    ports:
      # HTTPS só no IP do Tailscale; HTTP só em localhost.
      # O Docker ignora o UFW, então o IP precisa ser explícito.
      - "100.115.131.15:443:443"
      - "127.0.0.1:8480:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/upstream:/etc/nginx/upstream:ro
      - ./tls:/etc/nginx/tls:ro
    read_only: true
    tmpfs: [/tmp, /var/cache/nginx, /var/run]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-saude"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
    logging: *logs

  # Cutover das fases 1 e 2 (cutover-fase1-2.sh): recebe o tráfego da porta 8181 do legado
  # que chega pela Tailscale (REDIRECT) e divide entre o Nexus e o mapper. Só sobe no cutover.
  nexus-borda:
    image: nginx:1.28.0-alpine
    profiles: [fase12]
    network_mode: host
    command: ["nginx", "-c", "/etc/nginx/borda/nginx.conf", "-g", "daemon off;"]
    volumes:
      # Diretório, não arquivo: editar o arquivo troca o inode.
      - ./borda:/etc/nginx/borda:ro
    read_only: true
    tmpfs: [/tmp, /var/cache/nginx, /var/run]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
    logging: *logs

secrets:
  database_url:
    file: ./secrets/database_url
  sombra_token:
    file: ./secrets/sombra_token
  dossie_chave:
    file: ./secrets/dossie_chave
  database_url_dossie:
    file: ./secrets/database_url_dossie
  dossie_chave_legado:
    file: ./secrets/dossie_chave_legado
  # Cópia da chave do Dossiê legível pela API (uid 65532), para repassar as vendas do app.
  dossie_chave_api:
    file: ./secrets/dossie_chave_api

networks:
  monitoring:
    name: monitoring_default
    external: true
