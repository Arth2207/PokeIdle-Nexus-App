[workspace]
resolver = "2"
members = ["crates/nexus-api"]

[workspace.package]
edition = "2021"
license = "MIT"
publish = false

# Regras de lint valem para todos os crates do workspace.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
