# Política de dependências verificada no CI (cargo-deny).

[graph]
all-features = false

[advisories]
# Qualquer vulnerabilidade conhecida quebra o build.
yanked = "deny"

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Os crates do workspace se referem uns aos outros por caminho, sem versão. Isso só é
# permitido porque nenhum deles é publicado (publish = false).
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
