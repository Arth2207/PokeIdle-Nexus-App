# Política de dependências verificada no CI (cargo-deny).

[graph]
all-features = false

[advisories]
# Qualquer vulnerabilidade conhecida quebra o build.
yanked = "deny"
ignore = [
    # astral-tokio-tar sem manutenção. Vem do testcontainers, usado só nos testes de
    # integração (dev-dependency): não entra no binário nem na imagem. Revisar quando o
    # testcontainers trocar de crate de tar.
    { id = "RUSTSEC-2026-0440", reason = "só em dev-dependency (testcontainers); fora da imagem" },
    # SQLite < 3.54.0: retorna memória não inicializada quando WAL tem page size diferente do DB.
    # Vetor local — requer WAL crafted por terceiro. Não aplicável: lemos mapa.db do próprio
    # servidor (holodex). rusqlite 0.41 (fix) conflita com libsqlite3-sys exigido pelo sqlx 0.9.
    # Reavaliar quando sqlx 0.10 relaxar o pin de libsqlite3-sys.
    { id = "RUSTSEC-2026-0459", reason = "vetor não aplicável (mapa.db local/confiável); upgrade bloqueado por conflito sqlx-sqlite 0.9 × libsqlite3-sys" },
]

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Os crates do workspace se referem uns aos outros por caminho, sem versão. Isso só é
# permitido porque nenhum deles é publicado (publish = false).
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
